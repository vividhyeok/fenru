name: Verify and build
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python tools/bootstrap.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded
      - name: Windows release build
        run: flutter build windows --release
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Fenru-Windows-x64-portable.zip
          Get-FileHash dist/Fenru-Windows-x64-portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Fenru-Windows-x64-portable.zip" } | Set-Content dist/SHA256SUMS-Windows.txt
      - name: Build Windows installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' tools/fenru.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/Fenru-Windows-x64-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Fenru-Windows-x64-Setup.exe" } | Add-Content dist/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
      - name: Save generated source and formatting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verified
          path: |
            lib/
            test/
            integration_test/
            windows/
            android/
            pubspec.lock
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 tools/bootstrap.py
      - run: flutter pub get
      - run: flutter build apk --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Fenru-Android-test-signed.apk
          cd dist && sha256sum *.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
      - name: Publish explicit development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/windows/* artifacts/android/* --prerelease --verify-tag --title "Fenru $GITHUB_REF_NAME (development preview)" --notes-file docs/RELEASE_NOTES.md
