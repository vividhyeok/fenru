name: Verify and build
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python tools/bootstrap.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded
      - name: Windows document integration test
        run: flutter test integration_test/local_flow_test.dart -d windows --no-pub
      - name: Windows release build
        run: flutter build windows --release
      - name: Package Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $vsInstall = & 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe' -latest -products '*' -property installationPath
          $redist = Get-ChildItem "$vsInstall/VC/Redist/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory | Where-Object Name -Match '^Microsoft\.VC.*\.CRT$' | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ redistributable runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Fenru-Windows-x64-portable.zip
          Get-FileHash dist/Fenru-Windows-x64-portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Fenru-Windows-x64-portable.zip" } | Set-Content dist/SHA256SUMS-Windows.txt
      - name: Build Windows installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' tools/fenru.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/Fenru-Windows-x64-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Fenru-Windows-x64-Setup.exe" } | Add-Content dist/SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
      - name: Save generated source and formatting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verified
          path: |
            lib/
            test/
            integration_test/
            windows/
            android/
            pubspec.lock
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python3 tools/bootstrap.py
      - run: flutter pub get
      - name: Restore project signing key
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.FENRU_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fenru-release.jks"
            chmod 600 "$RUNNER_TEMP/fenru-release.jks"
            echo "FENRU_KEYSTORE_PATH=$RUNNER_TEMP/fenru-release.jks" >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release
        env:
          FENRU_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.FENRU_STORE_PASSWORD || '' }}
          FENRU_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.FENRU_KEY_ALIAS || '' }}
          FENRU_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.FENRU_KEY_PASSWORD || '' }}
      - name: Remove signing material before runtime tests
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fenru-release.jks"
          echo 'FENRU_KEYSTORE_PATH=' >> "$GITHUB_ENV"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android document integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: flutter test integration_test/local_flow_test.dart -d emulator-5554 --no-pub
      - run: |
          mkdir -p dist
          if [ '${{ steps.signing.outputs.signed }}' = 'true' ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/Fenru-Android-release.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk dist/Fenru-Android-test-signed.apk
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > dist/Android-signature.txt
          cd dist && sha256sum *.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
      - name: Publish explicit development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/windows/* artifacts/android/* --prerelease --verify-tag --title "Fenru $GITHUB_REF_NAME (development preview)" --notes-file docs/RELEASE_NOTES.md
