version: 0.1.0-alpha.2+2
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  drift: 2.35.2
